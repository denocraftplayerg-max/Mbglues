name: Build MobileGlues (Lib + APK)

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
        with:
          submodules: recursive
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.3.13750724
        run: |
          echo "y" | sdkmanager "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build MobileGlues Library (arm64-v8a)
        working-directory: MobileGlues-cpp
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_ANDROID_STL_TYPE=c++_static
          cmake --build . --config Release -j$(nproc)

      - name: Copy lib to APK project
        run: |
          mkdir -p MobileGlues-plugin/app/src/main/jniLibs/arm64-v8a
          cp MobileGlues-cpp/build/libmobileglues.so MobileGlues-plugin/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        working-directory: MobileGlues-plugin
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Locate and Rename APK
        run: |
          APK_PATH=$(find MobileGlues-plugin -name "*release.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" MobileGlues-plugin/MobileGlues-plugin-${{ github.sha }}.apk
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileGlues-plugin-APK
          path: MobileGlues-plugin/MobileGlues-plugin-*.apk
          retention-days: 30
