name: Build QUANNEGGAES4D (Lib + APK)

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.3.13750724
        run: |
          echo "y" | sdkmanager "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Build QUANNEGGAES4D Library (arm64-v8a)
        working-directory: Quanneggaes4d-cpp
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_ANDROID_STL_TYPE=c++_static
          cmake --build . --config Release -j$(nproc)

      - name: Copy lib to APK project
        run: |
          mkdir -p Quanneggaes4d-plugin/app/src/main/jniLibs/arm64-v8a
          cp Quanneggaes4d-cpp/build/libquanneggaes4d.so Quanneggaes4d-plugin/app/src/main/jniLibs/arm64-v8a/
          mkdir -p Quanneggaes4d-plugin/Quanneggaes4d/src/main/jniLibs/arm64-v8a
          cp libEGL_angle.so libGLESv2_angle.so libGLESv1_CM_angle.so \
            Quanneggaes4d-plugin/Quanneggaes4d/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle (Cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build APK (Debug)
        working-directory: Quanneggaes4d-plugin
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Locate and Rename APK
        run: |
          APK_PATH=$(find Quanneggaes4d-plugin -name "*debug.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" Quanneggaes4d-plugin/Quanneggaes4d-plugin-DEBUG-${{ github.sha }}.apk
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quanneggaes4d-plugin-APK
          path: Quanneggaes4d-plugin/Quanneggaes4d-plugin-*.apk
          retention-days: 30
