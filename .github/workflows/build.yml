name: Build MobileGlues for Android

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.3.13750724
        run: |
          echo "y" | sdkmanager "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Configure CMake for Android (arm64-v8a)
        working-directory: MobileGlues-cpp
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_ANDROID_STL_TYPE=c++_static

      - name: Build Library
        working-directory: MobileGlues-cpp/build
        run: cmake --build . --config Release -j$(nproc)

      - name: Verify Library
        working-directory: MobileGlues-cpp/build
        run: |
          ls -lh libmobileglues.so
          file libmobileglues.so
          readelf -h libmobileglues.so | grep -E "Class|Machine|OS/ABI"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmobileglues-android-arm64-v8a
          path: MobileGlues-cpp/build/libmobileglues.so
          retention-days: 30

      - name: Trigger APK build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: denocraftplayerg-max/MbgluesAPK
          event-type: new-so
          client-payload: '{"run_id":"${{ github.run_id }}","artifact":"libmobileglues-android-arm64-v8a"}'
